# Produção da EuMini: uma máquina, todos os processos em containers.
#
# Nenhum serviço publica porta. O visitante chega pela Cloudflare, que fala com o `cloudflared`
# por um túnel aberto de dentro para fora. A administração é por SSH (só chave, só o usuário deploy).
#
# No servidor, /opt/eumini tem este arquivo, o código em src/ (enviado pelo deploy, que gera
# as imagens lá mesmo) e dois arquivos de segredos fora do git:
#   .env      variáveis do próprio compose (TAG, senha do banco, token do túnel, NEXT_PUBLIC_*)
#   .env.app  configuração do Django (chaves de API, e-mail, S3...)
# Modelos: .env.example e .env.app.example. O deploy é o infra/deploy.sh (do PC).
# Localmente, SRC_DIR fica no padrão (a raiz do repositório): make prod-local.

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-backend: &backend
  image: eumini-backend:${TAG:?defina TAG}
  build:
    context: ${SRC_DIR:-..}/apps/backend
  env_file: .env.app
  environment:
    DATABASE_URL: postgres://eumini:${POSTGRES_PASSWORD:?}@postgres:5432/eumini
  depends_on:
    postgres: { condition: service_healthy }
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging: *logging

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: eumini
      POSTGRES_DB: eumini
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [pgdata:/var/lib/postgresql/data]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eumini -d eumini"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *logging

  web:
    <<: *backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/catalog/products/', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  worker:
    <<: *backend
    command: python manage.py run_generation_worker
    # Uma geração leva até 90 s: dá tempo de terminar a que está em andamento.
    stop_grace_period: 2m

  scheduler:
    <<: *backend
    command: python manage.py run_scheduler

  # Avulso, antes de cada deploy: docker compose run --rm migrate
  migrate:
    <<: *backend
    command: python manage.py migrate --noinput
    restart: "no"
    profiles: [tools]

  consumer:
    image: eumini-consumer:${TAG:?defina TAG}
    build:
      context: ${SRC_DIR:-..}
      dockerfile: apps/web/consumer/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://web:8000
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
        NEXT_PUBLIC_ABACATEPAY_PUBLIC_KEY: ${NEXT_PUBLIC_ABACATEPAY_PUBLIC_KEY:-}
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    depends_on: [consumer]
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    logging: *logging

volumes:
  pgdata:
