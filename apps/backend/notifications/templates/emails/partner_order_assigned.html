{% extends "emails/base.html" %}
{% block content %}
<p>O pedido <strong>{{ number }}</strong> foi atribuído a você: {{ pieces }} peça{{ pieces|pluralize }} para imprimir.</p>
<p>Prazo para postar: <strong>{{ post_by|date:"d/m/Y" }}</strong>.</p>
<p style="margin:24px 0"><a href="{{ order_url }}" style="background:#faff00;color:#7c3aed;border:1px solid #7c3aed;padding:12px 20px;border-radius:999px;text-decoration:none;font-weight:bold">Ver o pedido</a></p>
{% endblock %}
